# Repository-wide Ansible defaults. Applied to every playbook run from the repo root,
# so the example commands in the README work without extra flags. This is the Ansible
# analog of a shared helper: one place for settings every playbook should inherit.
# Override any value with the matching ANSIBLE_* environment variable or your own config.
[defaults]
inventory = Inventory/hosts.sample.yml
# YAML-formatted task results. Use result_format on the built-in default callback --
# the old `stdout_callback = yaml` plugin was removed from ansible-core.
result_format = yaml
interpreter_python = auto_silent
retry_files_enabled = False
# host_key_checking is left at its secure default (True): first connections verify the
# remote SSH host key. Manage known_hosts rather than disabling this.

[privilege_escalation]
become_method = sudo
become_user = root
become_ask_pass = False
