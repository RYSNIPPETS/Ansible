---
# Report service state using service_facts (no shell, read-only). With -e name= it
# reports one service; without it, it lists every running service.
# Usage:
#   ansible-playbook Services/service-status.yml
#   ansible-playbook Services/service-status.yml -e name=sshd
- name: Report service status
  hosts: all
  gather_facts: false
  vars:
    service_inventory: "{{ ansible_facts.services | default({}) }}"
  tasks:
    - name: Collect service facts
      ansible.builtin.service_facts:

    - name: Show one service
      ansible.builtin.debug:
        msg: >-
          {{ name }}: {{ service_details.state | default('not found') }}
          ({{ service_details.status | default('n/a') }})
      vars:
        service_details: >-
          {{ service_inventory.get(name, service_inventory.get(name ~ '.service', {})) }}
      when: name is defined

    - name: Show all running services
      ansible.builtin.debug:
        msg: >-
          {{ service_inventory | dict2items
             | selectattr('value.state', 'equalto', 'running')
             | map(attribute='key') | list }}
      when: name is not defined
